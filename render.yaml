# Render Blueprint: New → Blueprint → pick this repo. Render asks for the secret values below on first deploy.
services:
  - type: web
    name: code-review-agent
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8080"
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
